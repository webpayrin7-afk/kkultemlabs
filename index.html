<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>꿀템랩스 링크</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#22201b;--mute:#77736a;--line:#ebe7dd;--accent:#e8a317;--btn:#22201b;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171613;--card:#211f1b;--ink:#efece4;--mute:#a7a299;--line:#34312b;--btn:#efece4;--btnink:#171613}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mute);margin:12px 0}
.find{display:flex;gap:8px;margin:0 0 14px}
.find input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;scroll-margin-top:12px}
.item:target,.item.hit{outline:2px solid var(--accent)}
.item img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.body{flex:1;min-width:0}
.no{font-weight:700;color:var(--accent);font-size:13px}
.name{font-size:14px;margin:2px 0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-size:13px;color:var(--mute)}
.go{display:inline-block;margin-top:6px;padding:7px 12px;border-radius:999px;background:var(--btn);color:var(--btnink);text-decoration:none;font-size:13px;font-weight:600}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:20px}
</style></head><body><main>
<header><h1>꿀템랩스</h1><div class="sub">살림·가성비 꿀템 연구소 · 게시물 번호로 찾아보세요</div></header>
<div class="ad">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
<form class="find" onsubmit="go(event)"><input id="q" inputmode="numeric" placeholder="게시물 번호 (예: 1)" aria-label="게시물 번호"></form>
<p class="sub">아직 올라온 상품이 없어요.</p>
<footer>가격과 재고는 쿠팡에서 바뀔 수 있어요. 표시된 가격은 올린 날 기준입니다.</footer>
</main>
<script>
function go(e){e.preventDefault();var n=document.getElementById('q').value.replace(/\D/g,'');var el=document.getElementById('no-'+n);
document.querySelectorAll('.hit').forEach(function(x){x.classList.remove('hit')});
if(el){el.classList.add('hit');el.scrollIntoView({behavior:'smooth'})}else{alert(n+'번 상품이 없어요')}}
</script>
</body></html>
